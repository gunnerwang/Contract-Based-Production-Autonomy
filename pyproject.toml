[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cbpa-case-study"
version = "0.1.0"
description = "Runnable simulation of the CBPA dynamic reconfiguration case study"
requires-python = ">=3.10"
dependencies = [
    "simpy>=4.1",
    "claude-agent-sdk>=0.1",
    "pydantic>=2.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
export = ["pandas>=2.2", "tabulate>=0.9"]
# matplotlib alone, for the figure and aggregation scripts (the ui extra also provides it)
figures = ["matplotlib>=3.9"]
ui = [
    "streamlit>=1.30",
    "plotly>=5.18",
    "streamlit-autorefresh>=1.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
]
openai = [
    "openai>=1.0",
]
integration = [
    "httpx>=0.26",
]
basyx = [
    "basyx-python-sdk>=1.0",
]
opcua = [
    "asyncua>=1.0",
]
isaac = [
    "httpx>=0.26",  # remote API client; native mode uses omni.isaac
]
full-integration = [
    "httpx>=0.26",
    "basyx-python-sdk>=1.0",
    "asyncua>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
cbpa-run = "cbpa.runner.experiment:main"
